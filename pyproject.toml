[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-triage"
version = "0.1.0"
description = "Rule-based urgency triage for vehicle fault messages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["fault_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
